plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
}

android {
    compileSdk 35

    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())

    defaultConfig {
        applicationId "com.dongyang.android.youdongknowme"
        minSdk 24
        targetSdk 35
        versionCode 17
        versionName "2.3.1"

        buildConfigField "String", "BASE_URL", properties['BASE_URL']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        dataBinding true
        viewBinding true
    }
    namespace 'com.dongyang.android.youdongknowme'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // preference
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    // ViewModelScope
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2"

    // Retrofit2
    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-gson:3.0.0"

    // OkHttp
    implementation "com.squareup.okhttp3:okhttp:5.1.0"
    implementation "com.squareup.okhttp3:logging-interceptor:5.1.0"
    implementation "com.squareup.okhttp3:okhttp-urlconnection:5.1.0"

    // Gson
    implementation 'com.google.code.gson:gson:2.13.1'

    // Room
    implementation 'androidx.room:room-common:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'
    //noinspection KaptUsageInsteadOfKsp
    kapt "androidx.room:room-compiler:2.7.2"

    // Koin
    implementation "io.insert-koin:koin-core:4.1.0"
    implementation "io.insert-koin:koin-android:4.1.0"

    // Animation
    implementation 'com.daimajia.easing:library:2.4@aar'
    implementation 'com.daimajia.androidanimations:library:2.4@aar'

    // MaterialCalendarView
    implementation 'com.github.prolificinteractive:material-calendarview:2.0.0'
    implementation 'com.jakewharton.threetenabp:threetenabp:1.2.0'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.0.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging:25.0.0'

    // Timber
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Horizontal CalendarView
    implementation 'com.github.kizitonwose:CalendarView:1.0.4'

    // Flexbox
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // Lottie
    implementation "com.airbnb.android:lottie:6.6.7"

    // MinSdk
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Window Manager
    implementation 'androidx.window:window:1.4.0'
}
